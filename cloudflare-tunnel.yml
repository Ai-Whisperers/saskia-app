# Cloudflare Tunnel — config file
# Generated by: cloudflared tunnel create saskia-rms
# Tunnel ID is recorded in the credentials file (separate, not committed).

tunnel: saskia-rms
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

# Ingress rules: route saskia-rms.your-domain.com → localhost:8000 (Render)
ingress:
  - hostname: saskia-rms.your-domain.com
    service: http://localhost:8000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false
      keepAliveConnections: 8
      keepAliveTimeout: 90s
  - service: http_status:404

# Metrics (optional — for monitoring)
metrics: localhost:2000

# Logging
loglevel: info
logfile: /var/log/cloudflared.log
