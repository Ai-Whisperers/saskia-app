# pyproject.toml — Saskia RMS fase 1
# Per tech-stack-review recommendations (#1, #2, #5, #10):
# - Use uv for install (10-100× faster than pip; reproducible lockfile)
# - Pin openpyxl >=3.1,<4 (3.x stable, 4.x may break)
# - Use uvicorn[standard] (gets httptools, uvloop, websockets, watchfiles)
# - Hand-rolled schema-versioned migrations in db.py (NOT Alembic)
# - SQLAlchemy sync mode (NOT async)
# - Phase 1: pure server-rendered HTML (NOT HTMX)

[project]
name = "aiw-saskia-rms"
version = "0.1.0"
description = "Sistema de gestión de restaurante — Saskia Weiss Vander — Fase 1"
requires-python = ">=3.13,<3.14"
authors = [
    {name = "AI Whisperers", email = "ivan@ai-whisperers.dev"},
]
license = {text = "MIT"}

# Runtime dependencies
dependencies = [
    "fastapi>=0.115,<0.142",         # Pinned to a known-good major.minor
    "uvicorn[standard]>=0.32,<0.55",  # [standard] = httptools + uvloop + websockets + watchfiles
    "sqlalchemy>=2.0,<2.2",          # Sync mode (NOT async; documented in app/rms/db.py)
    "openpyxl>=3.1,<4",              # 3.x stable; 4.x may have breaking changes
    "jinja2>=3.1,<4",                # Templating for server-rendered HTML
    "python-multipart>=0.0.20",      # FastAPI form parsing (for HTML forms)
    "pydantic>=2.9,<3",               # Data validation; FastAPI uses it natively
    "loguru>=0.7,<0.8",               # App logging per tech-stack-review #13
    "cryptography>=50.0.1",
    "boto3>=1.43.85",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.5",
    "supabase>=2.31.0",
    "sentry-sdk[fastapi]>=2.10,<3",   # Error tracking (optional via SENTRY_DSN env var; free tier)
    "pyyaml>=6.0.3",
    "reportlab>=4.0,<5",           # PDF generation for /reportes/iva/pdf + /reportes/diario/pdf
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",                 # Test framework
    "pytest-cov>=6,<8",                # Coverage reporting
    "hypothesis>=6.115,<7",          # Property-based testing (per tech-stack-review #9)
    "ruff>=0.7,<1",                   # Linting
    "httpx>=0.27,<1",                  # TestClient (FastAPI)
    "testcontainers[postgresql]>=4.8,<5",  # E2.S2 — boots real PG in CI for hotfix regression coverage
]

# Entry point for uvicorn (run from project root: uvicorn app.rms.main:app --reload)
[project.scripts]
aiw-saskia = "app.rms.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Pytest config
# Coverage floor 35% matches .github/workflows/ci.yml. Both must agree.
# Strategy: docs/plans/2026-10-01-phase14-coverage-strategy.md
# Grows 35% → 80% via Tier 5/6/7 work (per the plan's growth table).
[tool.pytest.ini_options]
addopts = "-v --tb=short -p no:randomly --cov=app --cov-report=term-missing --cov-fail-under=35"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "browser: runs in a real headless browser via Playwright",
    "pg: real Postgres tests (testcontainers); skipped locally without Docker, run in CI",
    "smoke: end-to-end smoke tests (run on every commit)",
    "crud: CRUD roundtrip tests (run on every commit)",
    "analytics: analytics correctness (run before deploy)",
    "perf: performance budget tests (run nightly)",
    "security: security tests (run on every commit)",
    "auth: auth tests (run on every commit)",
    "manual: tests requiring human verification or long setup; skipped in default CI",
    "e2e: end-to-end scenario tests driving real routes (tests/e2e/)",
    "migration: schema-migration replay/archaeology tests",
    "slow: tests that take >1s; useful for `--ignore-glob`",
    "network: tests that hit external sites (skipped in CI without network)",
]
filterwarnings = [
    # starlette.testclient's BlockingPortal alias is deprecated upstream.
    # Not our code; wait for starlette bump to remove.
    "ignore::DeprecationWarning:starlette.testclient",
    # SQLAlchemy 2.0.36+ internally calls datetime.utcnow() at
    # sqlalchemy/sql/schema.py:3627. Their deprecation; will be fixed
    # when we bump SQLAlchemy.
    "ignore::DeprecationWarning:sqlalchemy.sql.schema",
    # starlette.testclient warns about httpx vs httpx2 (not our code).
    # StarletteDeprecationWarning inherits from UserWarning, not
    # DeprecationWarning, so it needs its own filter.
    # 2026-10-01: starlette dropped StarletteDeprecationWarning — filter
    # breaks pytest locally. Commented; re-enable when upstream restores.
    # "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# Ruff config
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Rule families enabled:
# E/F/W/I    — pycodestyle errors/warnings, pyflakes, isort (baseline)
# BLE        — blind-except (BACKLOG #53 silent-fail guard)
# PERF       — perf lint family (PERF401 list-comp, PERF102 dict-iterator)
# ANN        — flake8-annotations (P0 #1 — push type hints)
# S          — flake8-bandit (P0 #2 — SQL injection S608, secrets S105/S106)
# DTZ        — flake8-datetimez (P0 #3 — datetime.utcnow ban, TZ enforcement)
# B          — flake8-bugbear (default-arg, duplicate-except, etc.)
# PIE        — flake8-pie (misc correctness: unused-noqa, redundant-# noqa)
# RUF        — ruff-specific (mutable class attrs, implicit Optional)
# ASYNC      — async-correctness (async-def returning non-awaitable, blocking IO)
select = [
    "E", "F", "W", "I",
    "BLE", "PERF",
    "ANN", "S", "DTZ",
    "B", "PIE", "RUF", "ASYNC",
    # Explicit codes for RUF100 to recognize noqa as used:
    "BLE001", "F401", "F821", "ANN401",
]
ignore = [
    "E501",     # line-too-long (we use 100, ruff default is 88)
    "ANN401",   # dynamically typed expressions (Any) — too noisy
    "S101",     # assert statements (we use pytest assertions everywhere; runtime cost OK)
    "S104",     # hardcoded-bind-all-interfaces (we do bind 0.0.0.0 intentionally)
    "S311",     # pseudo-random generators (we use random for non-crypto seeding)
    "B008",     # default-arg function calls (FastAPI Depends() in defaults is correct)
    "RUF012",   # mutable class attrs (legacy SQLAlchemy model pattern)
    "E402",     # module-level import not at top (we have many intentional late imports)
]

# Allow these Unicode confusables everywhere — Spanish-language app uses
# − (U+2212 MINUS SIGN), × (U+00D7 MULTIPLICATION SIGN), – (U+2013 EN DASH),
# ∪ (U+222A UNION), ℹ (U+2139 INFO SYMBOL). Cyrillic а (U+0430) appears
# in one Cyrillic test fixture comment. These are intentional and the
# RUF001/002/003 family warnings are false positives for this codebase.
allowed-confusables = ["−", "×", "–", "∪", "ℹ", "а"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",    # test files may have non-top imports
    "ANN",     # test ergonomics — don't annotate every helper
    "S",       # bandit relaxed for tests
    "DTZ005",  # tests use datetime.now() without TZ for "today" arithmetic
    "B011",    # tests assert on raises(NotImplementedError) sometimes
]
"app/migrations/**/*.py" = [
    "E402", "ANN", "S608",   # migration SQL is hand-rolled
    "BLE001",                # migrations swallow known schema errors
]
"app/routers/dev.py" = [
    "S105", "S106",    # dev-only mock data
    "ANN",             # dev routes are throwaway
]
"app/rms/db.py" = [
    "S608",            # SQL builder helpers (text() calls are intentional)
    "BLE001",          # migrations use try/except ALTER TABLE
    "S110",            # migrations: try/except pass is the idempotent-ALTER pattern
]

# Backlog #53: ban silent except: pass in routers. Use BadRequest /
# logger.warning / explicit re-raise. Migration scripts (app/rms/migrations/)
# are exempt — they need to swallow known schema errors.
# ruff rule BLE001 fires on every bare `except Exception:` that re-raises
# nothing. Combined with our `tests/test_no_silent_excepts.py` test, this
# closes the door on silent failures.

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bandit]
hardcoded-tmp-directory = ["/tmp", "/var/tmp"]

# Hypothesis profile
[tool.hypothesis]
max_examples = 1000
deadline = 1000  # ms per example

# Mypy config (we use ruff for linting but mypy is the type checker; not strict yet)
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
]

# Coverage config — see docs/plans/2026-10-01-phase14-coverage-strategy.md
# AGENTS.md §Testing says 80% is the goal; the gate is set to the
# current measured floor (35%) so the CI fails when coverage drops,
# not when the goal isn't met. See the strategy doc for the
# 35% → 80% growth plan.
[tool.coverage.run]
source = ["app"]
omit = [
    "app/rms/migrations/*",  # noqa: historical, not importable
    "app/__main__.py",
]
# CI runners and hermes's sandbox sometimes can't write to CWD.
# Use /tmp explicitly so the coverage data file is always writable.
data_file = "/tmp/.coverage-saskia"

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "pass",
]
