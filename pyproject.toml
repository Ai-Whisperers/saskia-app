# pyproject.toml — Sazón fase 1
# Per tech-stack-review recommendations (#1, #2, #5, #10):
# - Use uv for install (10-100× faster than pip; reproducible lockfile)
# - Pin openpyxl >=3.1,<4 (3.x stable, 4.x may break)
# - Use uvicorn[standard] (gets httptools, uvloop, websockets, watchfiles)
# - Hand-rolled schema-versioned migrations in db.py (NOT Alembic)
# - SQLAlchemy sync mode (NOT async)
# - Phase 1: pure server-rendered HTML (NOT HTMX)

[project]
name = "sazon-rms"
version = "0.1.0"
description = "Sistema de gestión de restaurante — multi-tenant"
requires-python = ">=3.13,<3.14"
authors = [
    {name = "AI Whisperers", email = "ivan@ai-whisperers.dev"},
]
license = {text = "MIT"}

# Runtime dependencies
dependencies = [
    "fastapi>=0.115,<0.143",         # Pinned to a known-good major.minor
    "uvicorn[standard]>=0.32,<0.55",  # [standard] = httptools + uvloop + websockets + watchfiles
    "sqlalchemy>=2.0,<2.2",          # Sync mode (NOT async; documented in app/rms/db.py)
    "openpyxl>=3.1,<4",              # 3.x stable; 4.x may have breaking changes
    "jinja2>=3.1,<4",                # Templating for server-rendered HTML
    "python-multipart>=0.0.20",      # FastAPI form parsing (for HTML forms)
    "pydantic>=2.9,<3",               # Data validation; FastAPI uses it natively
    "loguru>=0.7,<0.8",               # App logging per tech-stack-review #13
    "cryptography>=50.0.1",
    "boto3>=1.43.85",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.5",
    "supabase>=2.31.0",
    "sentry-sdk[fastapi]>=2.10,<3",   # Error tracking (optional via SENTRY_DSN env var; free tier)
    "pyyaml>=6.0.3",
    "reportlab>=4.0,<6",           # PDF generation for /reportes/iva/pdf + /reportes/diario/pdf
]

# Development dependencies are in [dependency-groups] below (PEP 735).
# dev-base: minimum for CI (no Playwright).
# dev: full setup including Playwright + httpx + hypothesis + testcontainers.
# This block is intentionally empty for backward compatibility with
# older `uv sync --extra dev` invocations; the real deps are in
# [dependency-groups] which uv reads by default.

# Entry point for uvicorn (run from project root: uvicorn app.rms.main:app --reload)
[project.scripts]
sazon = "app.rms.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Pytest config
# Coverage floor 35% matches .github/workflows/ci.yml. Both must agree.
# Strategy: docs/plans/2026-10-01-phase14-coverage-strategy.md
# Grows 35% → 80% via Tier 5/6/7 work (per the plan's growth table).
[tool.pytest.ini_options]
# Default run skips the slow/flaky tiers. To include them:
#   pytest -m browser              # add browser tests
#   pytest -m browser or e2e       # add multiple
#   pytest -m "not manual"         # just exclude manual
# CI gates (ci.yml) override this via --strict-markers + targeted selection.
addopts = "-v --tb=short -p no:randomly --cov=app --cov-report=term-missing --cov-fail-under=35 -m 'not (browser or e2e or pg or manual)'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "browser: runs in a real headless browser via Playwright",
    "pg: real Postgres tests (testcontainers); skipped locally without Docker, run in CI",
    "smoke: end-to-end smoke tests (run on every commit)",
    "smoke_generated: auto-generated route smoke tests (run on every commit)",
    "crud: CRUD roundtrip tests (run on every commit)",
    "analytics: analytics correctness (run before deploy)",
    "perf: performance budget tests (run nightly)",
    "security: security tests (run on every commit)",
    "auth: auth tests (run on every commit)",
    "manual: tests requiring human verification or long setup; skipped in default CI",
    "e2e: end-to-end scenario tests driving real routes (tests/e2e/)",
    "migration: schema-migration replay/archaeology tests",
    "slow: tests that take >1s; useful for `--ignore-glob`",
    "network: tests that hit external sites (skipped in CI without network)",
]
filterwarnings = [
    # starlette.testclient's BlockingPortal alias is deprecated upstream.
    # Not our code; wait for starlette bump to remove.
    "ignore::DeprecationWarning:starlette.testclient",
    # SQLAlchemy 2.0.36+ internally calls datetime.utcnow() at
    # sqlalchemy/sql/schema.py:3627. Their deprecation; will be fixed
    # when we bump SQLAlchemy.
    "ignore::DeprecationWarning:sqlalchemy.sql.schema",
    # starlette.testclient warns about httpx vs httpx2 (not our code).
    # StarletteDeprecationWarning inherits from UserWarning, not
    # DeprecationWarning, so it needs its own filter.
    # 2026-10-01: starlette dropped StarletteDeprecationWarning — filter
    # breaks pytest locally. Commented; re-enable when upstream restores.
    # "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# Ruff config
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".github",  # GitHub Actions YAML files - ruff doesn't parse YAML
    "app/_archive",  # legacy cleanup archive — not part of the live codebase
    ".hermes/plans",  # session-scoped workflow plans, not source code
]

[tool.ruff.lint]
# Rule families enabled:
# E/F/W/I    — pycodestyle errors/warnings, pyflakes, isort (baseline)
# BLE        — blind-except (BACKLOG #53 silent-fail guard)
# PERF       — perf lint family (PERF401 list-comp, PERF102 dict-iterator)
# ANN        — flake8-annotations (P0 #1 — push type hints)
# S          — flake8-bandit (P0 #2 — SQL injection S608, secrets S105/S106)
# DTZ        — flake8-datetimez (P0 #3 — datetime.utcnow ban, TZ enforcement)
# B          — flake8-bugbear (default-arg, duplicate-except, etc.)
# PIE        — flake8-pie (misc correctness: unused-noqa, redundant-# noqa)
# RUF        — ruff-specific (mutable class attrs, implicit Optional)
# ASYNC      — async-correctness (async-def returning non-awaitable, blocking IO)
select = [
    "E", "F", "W", "I",
    "BLE", "PERF",
    "ANN", "S", "DTZ",
    "B", "PIE", "RUF", "ASYNC",
    # Explicit codes for RUF100 to recognize noqa as used:
    "BLE001", "F401", "F821", "ANN401",
]
ignore = [
    "E501",     # line-too-long (we use 100, ruff default is 88)
    "ANN401",   # dynamically typed expressions (Any) — too noisy
    "S101",     # assert statements (we use pytest assertions everywhere; runtime cost OK)
    "S104",     # hardcoded-bind-all-interfaces (we do bind 0.0.0.0 intentionally)
    "S311",     # pseudo-random generators (we use random for non-crypto seeding)
    "B008",     # default-arg function calls (FastAPI Depends() in defaults is correct)
    "RUF012",   # mutable class attrs (legacy SQLAlchemy model pattern)
    "E402",     # module-level import not at top (we have many intentional late imports)
]

# Allow these Unicode confusables everywhere — Spanish-language app uses
# − (U+2212 MINUS SIGN), × (U+00D7 MULTIPLICATION SIGN), – (U+2013 EN DASH),
# ∪ (U+222A UNION), ℹ (U+2139 INFO SYMBOL). Cyrillic а (U+0430) appears
# in one Cyrillic test fixture comment. These are intentional and the
# RUF001/002/003 family warnings are false positives for this codebase.
allowed-confusables = ["−", "×", "–", "∪", "ℹ", "а", "‹", "›", "σ"]

[tool.ruff.lint.per-file-ignores]
"data/*" = [
    "ANN",     # one-off workbook→seed pipeline scripts, not app code
    "S",       # scripts read local files / use subprocess freely
    "E", "W",  # style nits fine in throwaway tooling
    "F",       # unused imports / scratch intermediates
    "I",       # import order not worth enforcing on pipeline scripts
    "B",       # zip strict / loop-var nits
    "PERF",    # perf lints target the app, not one-off scripts
    "RUF",     # ruf nits (concat, conversion flag)
    "BLE",     # image-API retry loops catch broad Exception on purpose
]
"tests/*" = [
    "E402",    # test files may have non-top imports
    "ANN",     # test ergonomics — don't annotate every helper
    "S",       # bandit relaxed for tests
    "DTZ",     # tests use naive datetime for fixture math (legacy contract)
    "B011",    # tests assert on raises(NotImplementedError) sometimes
    "PERF401", # tests: build-then-iterate is fine, no need for list comp
    "BLE001",  # tests: defensive excepts are fine in fixture setup / teardown
    "B007",    # tests: loop control var not used in body is fine (for k in dict: ...)
    "PERF102", # tests: dict iteration order doesn't matter, .keys() vs direct iter is fine
    "RUF015",  # tests: single-element slice `xs[0]` is clearer than `next(iter(xs))`
    "E741",    # tests: short variable names (`l`, `env`, `row`) OK in test scope
    "F541",    # tests: f-strings without placeholders are fine for plain messages
]
"app/rms/models/**/*.py" = [
    "F821",    # SQLAlchemy 2.0 Mapped["ClassName"] forward references to other model modules
    "RUF012",  # legacy SQLAlchemy mutable class attrs
]
"app/rms/models/__init__.py" = [
    "F401",    # re-exports from models_legacy for the public API
]
"app/routers/produccion/__init__.py" = [
    "F401",    # explicit re-exports for the produccion router package
]
"app/rms/migrations/__init__.py" = [
    "F401",    # re-exports migration modules for the loader
]
"app/rms/sales/pre_sale_check.py" = [
    "F821",    # local imports + tz pattern; ASUNCION_TZ resolved at function entry
]
"app/rms/sales/pre_sale_check_cart.py" = [
    "F821",    # local imports + tz pattern; ASUNCION_TZ resolved at function entry
]
"app/rms/seed/sazon.py" = [
    "F821",    # forward references to local helper functions resolved lazily
]
"app/routers/produccion/operations.py" = [
    "F821",    # local ASUNCION_TZ + ProductionClosedDay usage
]
"app/routers/health.py" = [
    "F821",    # BackupResult forward reference for endpoint return type
]
"app/rms/seed/packs.py" = [
    "DTZ",     # generated seed packs mirror seed/sazon.py naive-UTC contract
]
"app/migrations/**/*.py" = [
    "E402", "ANN", "S608",   # migration SQL is hand-rolled
    "BLE001",                # migrations swallow known schema errors
    "S110",                  # migrations use try/except pass for idempotent ALTER TABLE
]
"app/rms/migrations/**/*.py" = [
    "E402", "ANN", "S608",   # migration SQL is hand-rolled
    "BLE001",                # migrations swallow known schema errors
    "S110",                  # migrations use try/except pass for idempotent ALTER TABLE
]
"app/routers/dev.py" = [
    "S105", "S106",    # dev-only mock data
    "ANN",             # dev routes are throwaway
]
"_smoke/*.py" = [
    "ANN",     # smoke scripts — ad-hoc utilities, no need for annotations
    "S",       # bandit relaxed — ad-hoc curl/subprocess patterns
    "DTZ",     # smoke scripts use naive datetime for ad-hoc timing
    "E501",    # long console lines are fine in smoke output
    "BLE001",  # smoke scripts intentionally swallow broad excepts
]
"scripts/*.py" = [
    "ANN",     # scripts are ad-hoc utilities, no need for annotations
    "S",       # bandit relaxed — scripts intentionally shell out / curl
    "BLE001",  # scripts may swallow errors with broad except
    "DTZ",     # scripts use naive datetime for ad-hoc timing
]
"docs/**/*.py" = [
    "BLE001",  # docs helper scripts: same rationale as scripts/
    "S",       # docs scripts: ad-hoc Playwright patterns
    "E501",    # long console output lines are fine
]
"run_migration.py" = [
    "BLE001",  # ad-hoc top-level migration runner, errors are diagnostic
]
"deploy/*.py" = [
    "S",       # deploy scripts intentionally shell out / call subprocess
    "F",       # unused imports OK in one-off deploy tooling
    "E501",    # long lines OK in deploy scripts
]
"app/rms/**/*.py" = [
    "BLE001",  # defensive broad excepts are intentional across RMS layer (legacy pattern)
]
"app/routers/**/*.py" = [
    "BLE001",  # defensive broad excepts in route handlers (legacy pattern, logging follows)
]
"app/services/**/*.py" = [
    "BLE001",  # defensive broad excepts in service layer
    "ANN",     # service helper signatures: explicit Any is fine for public surface
]
"app/integrations/*.py" = [
    "BLE001",  # integrations swallow external-service errors intentionally
]
"app/auth_supabase.py" = [
    "BLE001",  # auth path: broad except returns 401/500 contract
]
"app/observability/*.py" = [
    "BLE001",  # observability layer: never raise out of observability paths
    "S310",    # urlopen for SMTP/IMAP/SMS endpoints (not arbitrary URLs)
]
"app/rms/db.py" = [
    "S608",            # SQL builder helpers (text() calls are intentional)
    "BLE001",          # migrations use try/except ALTER TABLE
    "S110",            # migrations: try/except pass is the idempotent-ALTER pattern
]

# Backlog #53: ban silent except: pass in routers. Use BadRequest /
# logger.warning / explicit re-raise. Migration scripts (app/rms/migrations/)
# are exempt — they need to swallow known schema errors.
# ruff rule BLE001 fires on every bare `except Exception:` that re-raises
# nothing. Combined with our `tests/test_no_silent_excepts.py` test, this
# closes the door on silent failures.

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-bandit]
hardcoded-tmp-directory = ["/tmp", "/var/tmp"]

# Hypothesis profile
[tool.hypothesis]
max_examples = 1000
deadline = 1000  # ms per example

# Type checker config — Sazon does NOT currently run a type checker in CI.
# We evaluated mypy (config retained below) and ty (0.0.85, pilot). The
# decision (2026-10-09) is to NOT adopt either yet. See
# docs/operations/2026-10-09-sensez-ty-evaluation.md for the full analysis.
#
# When we do adopt one, [tool.mypy] config below is ready to use (or
# replace with [tool.ty] / ty.toml).
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[dependency-groups]
# dev-base: minimum needed to run the test suite in CI. No Playwright
# (134 MB wheel + 656 MB browser binaries), no pytest-randomly (disabled
# via -p no:randomly in addopts). Run by every CI job.
dev-base = [
    "pytest>=8.3,<10",        # Test framework
    "pytest-cov>=6,<8",       # Coverage reporting + --cov-fail-under gate
    "pytest-xdist>=3.8.0",    # Parallel test runner
    "ruff>=0.7,<1",           # Linting (ruff check + format)
]
# tooling: extra static-analysis tools (Sazon tooling rec 2026-10-08).
# Not required for the test suite; only needed by `make check` and
# the pre-commit hooks added 2026-10-08. Install with
# `uv sync --group tooling`.
tooling = [
    "vulture>=2.14",          # dead-code (replaces ad-hoc greps)
    "deadcode>=2.4",          # cross-file dead code (replaces vulture in some cases)
    "bandit>=1.7",            # security scan (broader than ruff S)
    "radon>=6.0",             # cyclomatic complexity
    "complexipy>=8",          # cognitive complexity (SonarSource spec, replaces radon-cc for human review)
    "pyright>=1.1",           # static type checker (catches real bugs that mypy misses)
    "deptry>=0.20",           # find unused/missing/transitive deps
    "interrogate>=1.7",       # docstring coverage (enforces 80% gate)
    "refurb>=2",              # modernization hints (FURB123 redundant casts etc.)
    "pip-audit>=2.7",         # CVE scan against pyproject.lock
    "reuse>=5.0",             # SPDX license header compliance
    "jscpd>=4.0",             # copy-paste detector (line-level)
    "sensez>=0.4",            # structural clone + code smell detector (Riley Barnett 2025)
]
# dev: full developer setup, including the browser stack. Local devs do
# `uv sync --group dev`; CI runs `uv sync --group dev-base` instead.
dev = [
    {include-group = "dev-base"},
    {include-group = "tooling"},
    "httpx>=0.27,<1",         # TestClient (FastAPI)
    "hypothesis>=6.115,<7",   # Property-based testing
    "playwright>=1.62.0",     # 9 browser tests; 134 MB wheel
    "pytest-randomly>=5.0.0", # currently disabled via -p no:randomly
    "testcontainers[postgresql]>=4.8,<5",  # 2 PG tests
]

# Coverage config — see docs/plans/2026-10-01-phase14-coverage-strategy.md
# AGENTS.md §Testing says 80% is the goal; the gate is set to the
# current measured floor (35%) so the CI fails when coverage drops,
# not when the goal isn't met. See the strategy doc for the
# 35% → 80% growth plan.
[tool.coverage.run]
source = ["app"]
omit = [
    "app/rms/migrations/*",  # noqa: historical, not importable
    "app/__main__.py",
]
# CI runners and hermes's sandbox sometimes can't write to CWD.
# Use /tmp explicitly so the coverage data file is always writable.
data_file = "/tmp/.coverage-sazon"

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "pass",
]
