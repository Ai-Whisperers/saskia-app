# Vale prose-lint configuration — Sazón RMS
# Docs: https://vale.sh/docs/config
# Usage: make docs-prose  →  uvx --from=vale vale docs README.md
#
# PHILOSOPHY: only rules that catch objectively-wrong prose survive here.
# The full Microsoft style (Quotes/We/Auto/Foreign = 8k+ findings) fights a
# bilingual ops-log repo; it was evaluated and rejected 2026-10-09.
# Vendored styles remain in styles/ for future per-rule opt-in.
#
# Style names are nested (zip layout Microsoft/Microsoft), so keys are
# doubled ("write-good.write-good.X") — correct, not a typo.
# Archive/generated exclusions are --glob flags in the Makefile.
# Runs fully offline (styles vendored; see styles/PROVENANCE.txt).

MinAlertLevel = warning
StylesPath = styles

[*]
# Both packs loaded, then aggressively filtered per-rule below.
BasedOnStyles = Vale, Microsoft, write-good

# ── Microsoft: entirely OFF (corporate style fights bilingual ops docs;
#    evaluated 2026-10-09: Quotes 2708 / We 2043 / Foreign 338 findings)
Microsoft.Microsoft.Quotes = false
Microsoft.Microsoft.We = false
Microsoft.Microsoft.Auto = false
Microsoft.Microsoft.Foreign = false
Microsoft.Microsoft.UIVerbs = false
Microsoft.Microsoft.Ellipses = false
Microsoft.Microsoft.HeadingColons = false
Microsoft.Microsoft.Negative = false
Microsoft.Microsoft.Avoid = false
Microsoft.Microsoft.DateOrder = false
Microsoft.Microsoft.AMPM = false
Microsoft.Microsoft.Hyphens = false
Microsoft.Microsoft.Plurals = false
Microsoft.Microsoft.SentenceLength = false
Microsoft.Microsoft.Weak = false
Microsoft.Microsoft.Wordiness = false
Microsoft.Microsoft.Spacing = false
Microsoft.Microsoft.SpacedNotes = false
Microsoft.Microsoft.Terms = false
Microsoft.Microsoft.HeadingAcronyms = false
Microsoft.Microsoft.Acronyms = false
Microsoft.Microsoft.Vocab = false
Microsoft.Microsoft.GeneralURL = false
Microsoft.Microsoft.OxfordComma = false
Microsoft.Microsoft.Semicolon = false
Microsoft.Microsoft.FirstPerson = false
Microsoft.Microsoft.Contractions = false
Microsoft.Microsoft.Headings = false
Microsoft.Microsoft.Dashes = false

Microsoft.Microsoft.Adverbs = false         # 430 findings; stylistic in op logs
Microsoft.Microsoft.HeadingPunctuation = false
Microsoft.Microsoft.DateFormat = false      # docs QUOTE the app's Spanish UI dates ("26 sep 2026"); US format is wrong here
Microsoft.Microsoft.Percentages = false     # same: quoted badge/label copy

# ── write-good: keep the objective subset ────────────────────────────────
write-good.write-good.E-Prime = false
write-good.write-good.Adverbs = false
write-good.write-good.TooWordy = false    # 1037 findings; mostly listy op docs
write-good.write-good.Weasel = false      # 358; "possibly/might" is honest ops language
write-good.write-good.So = false          # 22; "so" as connector is fine in notes

Vale.Spelling = false     # bilingual vocabulary
Vale.Repetition = false   # tables + ES terms trip it

# ── Opt-in: objective quality rules ──────────────────────────────────────
write-good.write-good.Passive = true
write-good.write-good.TooManyNegatives = true
write-good.write-good.Cliches = true
write-good.write-good.ThereIs = true

# CHANGELOG: dense factual log — prose rules don't apply
[CHANGELOG.md]
BasedOnStyles = Vale
Vale.Spelling = false
Vale.Repetition = false
