# .pre-commit-config.yaml — pre-commit hooks
# Per tech-stack-review #4 (CI) + #12 (pre-commit hooks):
# - Pre-commit prevents local breakage before commit
# - ruff: lint + format
# - pytest-fast: smoke tests on every commit (NOT full suite)
# - file-size sanity: blocks huge accidental commits

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest (smoke)
        entry: uv run pytest -x -q --no-cov tests/test_money.py tests/test_units.py
        language: system
        pass_filenames: false
        always_run: true

      - id: forbid-secret-files
        name: forbid accidental .env or secret commits
        entry: >-
            bash -c '
            for f in $(git diff --cached --name-only); do
              case "$f" in
                *.env|*.env.*|*/credentials|*/secrets.yaml|*/id_rsa|*/secrets.yml)
                  echo "ERROR: attempted to commit a secret-like file: $f. Aborting.";
                  exit 1
                  ;;
              esac
            done
            '
        language: system
        pass_filenames: false
        always_run: true

      - id: file-size-sanity
        name: block huge accidental files (over 1 MB)
        entry: >-
            bash -c '
            for f in $(git diff --cached --name-only); do
              if [ -f "$f" ]; then
                size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f");
                if [ "$size" -gt 1048576 ]; then
                  echo "WARN: $f is large (size $size bytes); verify this is intended.";
                  exit 1
                fi
              fi
            done
            exit 0
            '
        language: system
        pass_filenames: false

      - id: check-yaml
        name: validate YAML files
        entry: >-
            python -c "import yaml, sys;
            list(map(lambda p: yaml.safe_load(open(p)), [l.strip() for l in sys.stdin.read().splitlines() if l.strip()]))"
        language: system
        types: [yaml]

      - id: check-no-secrets
        name: block credential patterns in committed files
        # Per AIW AGENTS.md rule + credential-redacted-grep skill.
        # 2026-09-02: a rotated GitHub PAT was found in .git/config in a
        # shared scratch dir. This hook catches future instances.
        # Token-shape patterns: ghp_, ghs_, gho_, ghu_, github_pat_,
        # x-access-token: *** AKIA (AWS), generic JWTs, long key=values.
        entry: python scripts/check_no_secrets.py
        language: system
        pass_filenames: true
        types_or: [python, yaml, json, toml, markdown, text, shell]
        stages: [pre-commit]

      - id: lint-tier1
        name: template component conventions (lint_tier1.py)
        # Enforces ui-combo / ui-date / ui-toast usage over
        # native date inputs, native confirm(), hand-rolled empty states.
        # Without this, new templates ship with inconsistent UX.
        # The 7 known violations are grandfathered in CI via --no-verify
        # until they're fixed (see IMPROVEMENT_BACKLOG.md Tier 9).
        entry: uv run python scripts/lint_tier1.py
        language: system
        pass_filenames: false
        always_run: true

      - id: no-hardcoded-dates
        name: no hardcoded 2024-2029 dates in tests
        # Per skill aiw-local-first-app-tests Pitfall #8 — calendar drift
        # causes silent test rot. New tests must use datetime.now(...) or
        # freezegun, not literal dates.
        entry: uv run pytest -x -q --no-cov tests/test_no_hardcoded_dates.py
        language: system
        pass_filenames: false
        always_run: true

      - id: routers-require-auth
        name: every router must reference an auth gate
        # Per BACKLOG rule added 2026-09-29. Catches new routers that
        # forget to add require_login — security gate.
        entry: uv run pytest -x -q --no-cov tests/test_routers_require_auth.py
        language: system
        pass_filenames: false
        always_run: true

      - id: no-silent-excepts
        name: no silent except blocks in routers
        # Per BACKLOG #53. AST-based scan over every except block.
        entry: uv run pytest -x -q --no-cov tests/test_no_silent_excepts.py
        language: system
        pass_filenames: false
        always_run: true

      # ── Tooling-hardening hooks (Sazon tooling rec 2026-10-08) ──────────
      # Cheap → expensive. Skipped in --no-verify. All local; no external
      # repo. Requires `uv sync --all-extras` (installs vulture, bandit,
      # radon via [dependency-groups].dev).

      - id: vulture
        name: dead-code scan (vulture, --min-confidence 80)
        # Sazon tooling rec 2026-10-08: catch unused functions/classes
        # like the old settings_original.py that crept back via copy.
        # First run may have noise; triage + git rm in same commit.
        # Ignores FastAPI decorators + lifespan + common Python decorators.
        entry: >-
            uv run vulture app/ scripts/ --min-confidence 80
            --ignore-decorators @app.get,@app.post,@app.put,@app.delete,@router.get,@router.post,@router.put,@router.delete,@app.exception_handler,@app.middleware,@app.on_event,@staticmethod,@classmethod,@property
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: bandit
        name: security scan (bandit, medium+high severity)
        # Ruff S rules are partial. bandit catches SQL-injection /
        # weak-crypto / hardcoded-temp-file that ruff misses.
        # -ll = medium+high severity only.
        entry: uv run bandit -r app/ -ll -q --exclude app/_archive
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: radon-cc
        name: cyclomatic-complexity ceiling (C grade or worse blocks)
        # Sazon tooling rec 2026-10-08: enforce CC <= B grade. Functions
        # at C (CC 11-20) or worse fail. Wrapper script
        # (scripts/check_complexity.py) parses radon output, exits 1 on
        # violations, prints the refactor list.
        entry: uv run python scripts/check_complexity.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: forbid-legacy-modules
        name: forbid settings_original.py + production_scheduler.py
        # Sazon tooling rec 2026-10-08: both deleted on 2026-10-08. This
        # hook prevents accidental re-add. If you really need them back,
        # comment the hook for that commit.
        entry: >-
            bash -c '
            for f in $(git diff --cached --name-only); do
              case "$f" in
                */settings_original.py|*/production_scheduler.py)
                  echo "ERROR: $f was deleted on 2026-10-08; do not re-add. See docs/operations/2026-10-08-tooling-hardening.md.";
                  exit 1
                  ;;
              esac
            done
            '
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

# Install:
#   uv tool install pre-commit
#   pre-commit install
# After install, every `git commit` runs these hooks locally.
