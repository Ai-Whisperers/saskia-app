<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" aria-hidden="true" style="display:block;margin:0 auto 1.5rem;">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="counter-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" rx="16" fill="url(#hero-bg)"/>
  <!-- Counter/surface -->
  <rect x="20" y="130" width="360" height="50" rx="8" fill="#f97316"/>
  <rect x="20" y="120" width="360" height="20" rx="6" fill="url(#counter-top)"/>
  <!-- POS register on counter -->
  <rect x="140" y="80" width="120" height="50" rx="6" fill="#1e293b"/>
  <rect x="150" y="88" width="100" height="28" rx="3" fill="#22c55e" opacity="0.8"/>
  <text x="200" y="106" font-family="monospace" font-size="14" fill="white" text-anchor="middle">Gs. 45.000</text>
  <!-- Receipt -->
  <rect x="268" y="70" width="50" height="65" rx="3" fill="white"/>
  <line x1="273" y1="80" x2="313" y2="80" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="273" y1="87" x2="313" y2="87" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="273" y1="94" x2="313" y2="94" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="273" y1="101" x2="305" y2="101" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="273" y1="108" x2="310" y2="108" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="273" y1="118" x2="313" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <!-- Decorative pastry items on counter -->
  <circle cx="80" cy="115" r="18" fill="#fbbf24" opacity="0.9"/>
  <circle cx="320" cy="112" r="22" fill="#f97316" opacity="0.85"/>
  <circle cx="85" cy="120" r="14" fill="#fb923c" opacity="0.8"/>
  <!-- Label -->
  <text x="200" y="190" font-family="system-ui,sans-serif" font-size="13" fill="#9a3412" text-anchor="middle">Gestión de panadería y cafetería</text>
</svg>