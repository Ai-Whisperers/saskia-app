<!-- Shared stock-adjust modal + controller: included by inventario.html and ingrediente_detalle.html -->
<dialog id="stock-adjust-modal" class="modal" aria-labelledby="adj-title" aria-modal="true">
  <div class="modal-dialog">
    <div class="modal-header">
      <h2 id="adj-title">
        <svg class="icon" aria-hidden="true"><use href="#icon-edit"/></svg>
        Ajustar stock
      </h2>
      <button type="button" class="btn btn-sm btn-ghost" onclick="this.closest('dialog').close()" aria-label="Cerrar">
        <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
      </button>
    </div>
    <form method="post" id="stock-adjust-form" onsubmit="var amt=parseFloat(this.adjustment_abs.value)||0; var tipo=document.querySelector('input[name=\'mov_tipo\']:checked'); this.adjustment.value = (tipo && tipo.value===\'salida\') ? -Math.abs(amt) : Math.abs(amt); return validateAdjustment(this);"><input type="hidden" name="adjustment" value="">
      <div class="modal-body">
        <p><strong id="adj-ing-name"></strong> — Stock actual: <span id="adj-ing-current"></span></p>
        <input type="hidden" name="ing_id" id="adj-ing-id" value="">
        <div class="form-row">
          <span class="form-label-like">Tipo de movimiento</span>
          <div class="segmented-control" role="radiogroup" aria-label="Tipo de movimiento">
            <input type="radio" name="mov_tipo" value="entrada" id="mov-in" checked>
            <label for="mov-in">+ Entrada (compra / hallazgo)</label>
            <input type="radio" name="mov_tipo" value="salida" id="mov-out">
            <label for="mov-out">− Salida (merma / ajuste)</label>
          </div>
        </div>
        <div class="form-row">
          <label for="adj-amount">Cantidad (solo número positivo)</label>
          <input type="number" step="0.01" min="0.01" id="adj-amount" name="adjustment_abs" required
                 placeholder="Ej: 5">
          <small>Stock resultante: <strong id="adj-preview">—</strong></small>
        </div>
        <div class="form-row">
          <label for="adj-reason">Motivo (opcional)</label>
          <input type="text" id="adj-reason" name="reason" maxlength="200"
                 placeholder="Ej: rotura, conteo físico, merma">
        </div>
        <div id="negative-warning" class="alert alert-warn" role="alert" style="display:none;">
          <svg class="icon" aria-hidden="true"><use href="#icon-warn"/></svg>
          <span id="negative-warning-text"></span>
        </div>
        <input type="hidden" name="confirm_negative" id="confirm-negative" value="">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="this.closest('dialog').close()">Cancelar</button>
        <button type="submit" id="adjust-submit-btn" class="btn btn-primary">Guardar ajuste</button>
      </div>
    </form>
  </div>
</dialog>

<script>
var _currentStock = 0;
var _currentUnit = '';
var _minStock = 0;

function _adjUpdatePreview() {
  var amt = parseFloat(document.getElementById('adj-amount').value);
  var tipo = document.querySelector('input[name="mov_tipo"]:checked');
  var el = document.getElementById('adj-preview');
  if (isNaN(amt) || !_currentStock) { el.textContent = '—'; return; }
  var res = tipo && tipo.value === 'salida' ? _currentStock - amt : _currentStock + amt;
  el.textContent = _currentStock.toFixed(2) + ' → ' + res.toFixed(2) + ' ' + _currentUnit;
  if (res < 0) { el.style.color = 'var(--color-danger)'; }
  else if (res < _minStock) { el.style.color = 'var(--color-warn)'; }
  else { el.style.color = 'var(--color-success)'; }
}
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'adj-amount') _adjUpdatePreview();
});
document.addEventListener('change', function (e) {
  if (e.target && e.target.name === 'mov_tipo') _adjUpdatePreview();
});

function openAdjustModal(ingId, ingName, currentStock, unit, minStock) {
  var m = document.getElementById('stock-adjust-modal');
  m.querySelector('form').action = '/inventario/' + ingId + '/ajustar';
  document.getElementById('adj-ing-id').value = ingId;
  document.getElementById('adj-ing-name').textContent = ingName;
  document.getElementById('adj-ing-current').textContent = currentStock.toFixed(2) + ' ' + unit;
  document.getElementById('adj-amount').value = '';
  document.getElementById('adj-preview').textContent = '—';
  var _in = document.getElementById('mov-in'); if (_in) _in.checked = true;
  document.getElementById('adj-reason').value = '';
  document.getElementById('confirm-negative').value = '';
  document.getElementById('negative-warning').style.display = 'none';
  document.getElementById('adjust-submit-btn').textContent = 'Guardar ajuste';
  _currentStock = currentStock;
  _minStock = minStock || 0;
  _currentUnit = unit;
  m.showModal();
}

function validateAdjustment(form) {
  var amt = parseFloat(document.getElementById('adj-amount').value);
  if (isNaN(amt) || amt === 0) {
    alert('La cantidad debe ser distinta de cero.');
    return false;
  }
  var resultingStock = _currentStock + amt;
  if (resultingStock < 0) {
    var warnDiv = document.getElementById('negative-warning');
    var warnText = document.getElementById('negative-warning-text');
    warnText.textContent = '¡Esto llevaría el stock a ' + resultingStock.toFixed(2) + ' ' + _currentUnit + '. Hacé click en "Confirmar stock negativo" para aceptar.';
    warnDiv.style.display = 'flex';
    document.getElementById('adjust-submit-btn').textContent = 'Confirmar stock negativo';
    document.getElementById('confirm-negative').value = 'yes';
    return false;
  }
  var btn = form.querySelector('[type=submit]');
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  return true;
}
</script>
