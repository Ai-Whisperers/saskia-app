{% extends "base.html" %}
{% block title %}{{ 'Editar' if mode == 'edit' else 'Nuevo' }} proveedor{% endblock %}
{% block content %}
<h1>{{ 'Editar' if mode == 'edit' else 'Nuevo' }} proveedor</h1>

<form method="post" action="{{ '/suppliers/nuevo' if mode == 'new' else '/suppliers/' ~ supplier.id ~ '/editar' }}">
  <div class="form-row">
    <label for="name">Nombre del proveedor *</label>
    <input type="text" id="name" name="name" required maxlength="120" value="{{ supplier.name if supplier else '' }}" placeholder="Ej: Harinas del Paraguay S.A.">
  </div>
  <div class="form-row">
    <label for="contact_name">Persona de contacto</label>
    <input type="text" id="contact_name" name="contact_name" maxlength="120" value="{{ supplier.contact_name if supplier and supplier.contact_name else '' }}" placeholder="Ej: Juan Pérez">
  </div>
  <div class="grid grid-2">
    <div class="form-row">
      <label for="phone">Teléfono</label>
      <input type="text" id="phone" name="phone" maxlength="32" value="{{ supplier.phone if supplier and supplier.phone else '' }}" placeholder="Ej: +595 21 123 456">
    </div>
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" maxlength="120" value="{{ supplier.email if supplier and supplier.email else '' }}" placeholder="Ej: ventas@harinas.com.py">
    </div>
  </div>
  <div class="form-row">
    <label for="address">Dirección</label>
    <textarea id="address" name="address" rows="2" maxlength="200">{{ supplier.address if supplier and supplier.address else '' }}</textarea>
  </div>
  <div class="form-row">
    <label for="notes">Notas</label>
    <textarea id="notes" name="notes" rows="2" maxlength="2000">{{ supplier.notes if supplier and supplier.notes else '' }}</textarea>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Guardá</button>
    <a href="/suppliers" class="btn">Cancelar</a>
  </div>
</form>

{% endblock %}
