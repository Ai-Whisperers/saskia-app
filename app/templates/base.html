<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sistema de gestión{% endblock %} — Saskia RMS</title>
  <link rel="stylesheet" href="/static/app.css">
  <script>
    // Theme persistence — read before paint to avoid flash.
    (function() {
      try {
        var t = localStorage.getItem('saskia-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
  <nav class="topnav" aria-label="Navegación principal">
    <a href="/" class="brand">🍰 Saskia RMS</a>
    <div class="nav-links">
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Inicio</a>
      <a href="/productos" {% if request.url.path.startswith("/productos") %}aria-current="page"{% endif %}>Productos</a>
      <a href="/recetas" {% if request.url.path.startswith("/recetas") %}aria-current="page"{% endif %}>Recetas</a>
      <a href="/inventario" {% if request.url.path.startswith("/inventario") %}aria-current="page"{% endif %}>Inventario</a>
      <a href="/ventas" {% if request.url.path.startswith("/ventas") %}aria-current="page"{% endif %}>Ventas</a>
      <a href="/clientes" {% if request.url.path.startswith("/clientes") %}aria-current="page"{% endif %}>Clientes</a>
      <a href="/produccion" {% if request.url.path.startswith("/produccion") %}aria-current="page"{% endif %}>Producción</a>
      <a href="/eod" {% if request.url.path.startswith("/eod") %}aria-current="page"{% endif %}>Cierre</a>
      <a href="/merma" {% if request.url.path.startswith("/merma") %}aria-current="page"{% endif %}>Merma</a>
      <a href="/reportes" {% if request.url.path.startswith("/reportes") %}aria-current="page"{% endif %}>Reportes</a>
      <a href="/auditoria" {% if request.url.path.startswith("/auditoria") %}aria-current="page"{% endif %}>Auditoría</a>
      <a href="/excel" {% if request.url.path.startswith("/excel") %}aria-current="page"{% endif %}>Excel</a>
    </div>
    <div class="nav-right">
      <button type="button" class="theme-toggle" id="theme-toggle"
              aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>
      <a href="/healthz" class="health-link" title="Estado del servidor" aria-label="Estado del servidor">●</a>
      <a href="/logout" class="logout-link" title="Cerrar sesión" aria-label="Cerrar sesión">⎋</a>
    </div>
  </nav>

  <div class="alerts-region" aria-live="polite" aria-atomic="true">
    {% block alerts %}{% endblock %}
  </div>


  <main class="container" id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <small>Sistema local · {{ now_year() }} · {{ "Gs." }} integer</small>
  </footer>

  <script>
    // Dark mode toggle (per stack audit 2026-09-02).
    (function() {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      function paint() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.textContent = dark ? '☀️' : '🌙';
        btn.setAttribute('aria-pressed', String(dark));
      }
      paint();
      btn.addEventListener('click', function() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (dark) {
          document.documentElement.removeAttribute('data-theme');
          try { localStorage.setItem('saskia-theme', 'light'); } catch (e) {}
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          try { localStorage.setItem('saskia-theme', 'dark'); } catch (e) {}
        }
        paint();
      });
    })();
  </script>
</body>
</html>
