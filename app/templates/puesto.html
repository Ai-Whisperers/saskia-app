{% extends "base.html" %}
{% block title %}Elegí el puesto{% endblock %}
{% block content %}
<section class="station-chooser">
  <h1>¿Qué vas a hacer?</h1>
  <p class="muted">Elegí un puesto. El trabajo de los otros queda afuera hasta que vuelvas a elegir.</p>
  <div class="station-grid">
    {% for s in stations %}
    <form method="post" action="/puesto">
      <input type="hidden" name="station" value="{{ s.id }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="station-card">
        <span class="station-card-title">{{ s.label }}</span>
        <span class="station-card-blurb">{{ s.blurb }}</span>
      </button>
    </form>
    {% endfor %}
  </div>
</section>
<style>
  .station-chooser {
    width: min(52rem, 100%);
    margin: 0 auto;
    text-align: center;
  }
  .station-chooser h1,
  .station-chooser .muted { margin-left: auto; margin-right: auto; }
  .station-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
    margin-top: 1.25rem;
  }
  .station-grid form { margin: 0; flex: 1 1 14rem; max-width: 16rem; }
  .station-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .4rem;
    width: 100%;
    min-height: 8rem;
    padding: 1rem 1.1rem;
    text-align: center;
    border: 1px solid var(--color-border, #d7d3cc);
    border-radius: 12px;
    background: var(--color-surface, #fff);
    cursor: pointer;
  }
  .station-card:hover { border-color: var(--color-accent, #8a5a2a); }
  .station-card-title { font-size: 1.15rem; font-weight: 650; }
  .station-card-blurb { color: var(--color-muted, #5c574e); font-size: .95rem; line-height: 1.35; }
</style>
{% endblock %}
