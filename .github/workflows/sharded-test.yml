# .github/workflows/sharded-test.yml — EXPERIMENTAL
#
# 2026-10-09 status: design complete (see docs/ci/sharded-test-design.md)
# but NOT YET ENABLED as a required check. The migration plan in the
# design doc says to run for 7 days head-to-head against ci.yml's test
# job first, then promote if wall-clock improves ≥30% and total minutes
# stay under 1800/mo.
#
# Why this file exists even though it's not enabled:
#   - Easier to compare runs side-by-side if both workflows exist
#   - Operators can `gh workflow run sharded-test.yml` manually
#   - The branch-protection rule for "required: sharded-test" can be
#     flipped on in one click once validated
#
# Don't delete this file. Don't enable it in branch protection yet.

name: Sharded test (3-way matrix, experimental)

on:
  workflow_dispatch:  # manual trigger only until validation completes
  # Uncomment these once validated:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]

concurrency:
  group: sharded-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: shard ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: unit-fast
            test_args: "tests/ --ignore=tests/e2e --ignore=tests/browser -k 'test_a or test_b or test_c or test_d or test_e or test_f or test_g or test_h or test_i or test_j or test_k or test_l'"
          - name: unit-slow
            test_args: "tests/ --ignore=tests/e2e --ignore=tests/browser -k 'test_m or test_n or test_o or test_p or test_q or test_r or test_s'"
          - name: unit-large
            test_args: "tests/ --ignore=tests/e2e --ignore=tests/browser -k 'test_t or test_u or test_v or test_w or test_x or test_y or test_z'"

    env:
      SASKIA_TEST_AUTH_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install uv
uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: rm -rf .venv && uv sync --only-group dev-base --no-default-groups

      - name: Run shard ${{ matrix.shard.name }}
        run: |
          uv run pytest \
            ${{ matrix.shard.test_args }} \
            -n 2 --dist=loadscope \
            --no-header \
            --tb=short \
            --cov=app \
            --cov-report=xml:/tmp/coverage-${{ matrix.shard.name }}.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage-${{ matrix.shard.name }}
          path: /tmp/coverage-${{ matrix.shard.name }}.xml
          if-no-files-found: ignore

  coverage:
    name: combine coverage
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install uv + coverage
uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.5.x"
      - name: Set up Python
        run: uv python install 3.13
      - name: Download all coverage artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          path: /tmp/coverage
      - name: Combine coverage
        run: |
          uv pip install --system coverage
          coverage combine /tmp/coverage/*.xml
          coverage report
      - name: Upload combined report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage-combined
          path: .coverage coverage.xml
          if-no-files-found: ignore
