# .github/workflows/smoke.yml — Deploy-shape smoke test
# Per docs/wishlist/raw/2026-09-04-ci-smoke-against-deploy-shape-env.md
# Catches migration drift BEFORE the deploy hits Render.
# Runs in addition to the regular CI test (ci.yml).

name: Smoke (deploy-shape)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Boot ephemeral Postgres
        # Use Postgres 16 to match production's Neon Postgres 18.x as
        # closely as practical. Migrations are dialect-aware.
        run: |
          docker run -d --rm \
            --name saskia-smoke-pg \
            -e POSTGRES_USER=saskia \
            -e POSTGRES_PASSWORD=saskia \
            -e POSTGRES_DB=saskia \
            -p 5432:5432 \
            postgres:16-alpine
          # Wait for it to be ready
          for i in $(seq 1 30); do
            if docker exec saskia-smoke-pg pg_isready -U saskia; then
              echo "postgres ready"
              break
            fi
            sleep 1
          done

      - name: Pre-provision Postgres schema with create_all
        # Many migrations (1-98) were written SQLite-first and use
        # SQLite-only syntax (PRAGMA, AUTOINCREMENT, INTEGER-as-boolean).
        # Running them from scratch on Postgres fails with syntax errors.
        # Real production Postgres is provisioned by `init_db()` calling
        # `Base.metadata.create_all()`, which is dialect-aware. The
        # migration chain then runs idempotently on top, bumping the
        # schema_version to head without re-creating tables.
        env:
          DATABASE_URL: postgresql+psycopg://saskia:saskia@localhost:5432/saskia
        run: |
          uv run python -c "
          from app.rms.models import Base
          from sqlalchemy import create_engine, text
          engine = create_engine('postgresql+psycopg://saskia:saskia@localhost:5432/saskia', future=True)
          Base.metadata.create_all(engine)
          # create_all() brings every model table up-to-date on Postgres
          # (CREATE TABLE / ALTER TABLE / CREATE INDEX are all
          # dialect-aware via SQLAlchemy types). The migration chain
          # is SQLite-first and not designed to run from scratch on
          # Postgres, so we seed app_meta with the head version and let
          # init_db() no-op the chain.
          import re
          m = re.search(r'MIGRATIONS\s*=\s*\{(.+?)\}', open('app/rms/db.py').read(), re.DOTALL)
          head_version = 0
          if m:
              # Find all "N:" version keys at the start of lines
              head_version = max(
                  (int(line.split(':')[0].strip())
                   for line in m.group(1).splitlines()
                   if line.strip() and line.strip().split(':')[0].strip().isdigit()),
                  default=0,
              )
          with engine.connect() as conn:
              conn.execute(text(\"INSERT INTO app_meta (key, value, updated_at) VALUES ('schema_version', :v, NOW()::text) ON CONFLICT (key) DO UPDATE SET value = :v, updated_at = NOW()::text\"), {'v': str(head_version)})
              conn.commit()
          # init_db(engine) is intentionally NOT called: the migration
          # chain is SQLite-first and would error on Postgres (PRAGMA,
          # AUTOINCREMENT, INTEGER-as-boolean). create_all() already
          # brought the schema to the model state; the schema_version
          # row tells init_db() in the smoke step that there's nothing
          # to do.
          print(f'pre-provision complete; schema_version at {head_version}')
          "

      - name: Run smoke test
        env:
          DATABASE_URL: postgresql+psycopg://saskia:saskia@localhost:5432/saskia
          # Migrations already applied during pre-provision; this run
          # just verifies init_db is idempotent (re-runs no-op, no errors).
          AIW_SASKIA_RUN_MIGRATIONS: "0"
          PORT: "18999"
        run: |
          uv run python scripts/smoke_test_deploy_shape.py \
            --skip-docker --skip-build --port 18999

      - name: Teardown
        if: always()
        run: docker stop saskia-smoke-pg || true
