# QA Department gates (advisory) — caller only.
# All department code lives in Ai-Whisperers/aiw-org (.github/workflows/qa-gates.yml).
# Current mode: ADVISORY (app suite has known reds; budget-blocked CI anyway).
# To enforce: the aiw-org runner already exits non-zero; remove
# continue-on-error here once sazon-app main is green.
name: AIW QA Gates (department)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa-gates:
    # Pinned to SHA, NOT a branch ref. GH Actions rejects branch refs
    # in `uses:` for security (mutable refs can swap in malicious code
    # between the workflow_dispatch and the actual run). The branch
    # `docs/qa-dept-wiring-2026-09-25` in aiw-org was the 2026-09-25
    # wiring; if the caller needs to update, bump the SHA after a
    # review of the new aiw-org content.
    uses: Ai-Whisperers/aiw-org/.github/workflows/qa-gates.yml@fe210c0d2bee2fd80b24e23b6a5a517c95ede705
    with:
      coverage_floor: 80
      perf_budget_seconds: 600
      python_version: '3.13'
