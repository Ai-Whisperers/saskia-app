# .github/zizmor.yml — zizmor configuration for the Sazon RMS repo
#
# zizmor is a static analyzer for GitHub Actions workflows.
# https://docs.zizmor.sh/configuration/
#
# Policy (updated 2026-10-09 after the SHA-pinning PR):
#   - All 8 categories of "must fix" findings are promoted to HIGH severity
#     and block PRs via the workflows-lint.yml CI gate.
#   - The SHA-pinning PR (PR #96) paid the unpinned-uses + artipacked debt
#     by replacing every `uses: action@vN` with `uses: action@<sha>  # vN`
#     and adding `persist-credentials: false` to every checkout.
#   - 8 excessive-permissions findings (missing `permissions:` blocks)
#     are the only HIGH findings left; they get fixed in the next PR.
#
# Run: uvx --from zizmor zizmor --config .github/zizmor.yml .github/workflows/
#
# To regenerate the SHAs after a version bump, see:
#   scripts/pin_workflow_actions.py

rules:
  # Critical (escalate to HIGH severity = blocks PR via CI gate)
  template-injection:
    remap:
      severity: high
  cache-poisoning:
    remap:
      severity: high
  excessive-permissions:
    remap:
      severity: high
  secrets-inherit:
    remap:
      severity: high
  known-vulnerable-actions:
    remap:
      severity: high
  forbidden-uses:
    remap:
      severity: high
  unpinned-uses:
    remap:
      severity: high
  artipacked:
    remap:
      severity: high
