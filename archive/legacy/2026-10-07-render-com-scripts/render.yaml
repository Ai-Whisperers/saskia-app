# render.yaml — DEPRECATED 2026-09-24
#
# Sazón is now deployed on the VPS (paragu-ai) using Docker Swarm.
# The Render deployment is no longer the source of truth. This file is
# kept for historical reference and as a fallback option if VPS deployment
# needs to be retired.
#
# Active deployment: VPS at https://sazon-vps.paragu-ai.com
# Active config:     deploy-to-vps.sh + docker-stack.yml
#
# To re-enable Render:
#   1. Set DATABASE_URL to point at the same SQLite/Postgres the VPS uses
#      (we'd need to migrate Render's Neon Postgres to schema v48 first —
#      this has NOT been done; see "Open issues" below).
#   2. Update DATABASE_URL on Render dashboard to point at VPS's DB OR
#      run migrations 28-32 on the Neon Postgres (not done).
#   3. Flip autoDeploy back to true.
#
# Open issues if you want to bring Render back:
#   - Migrations 28-32 (audit log pruning, sales tz, market price reference,
#     compliance info, product tax HACCP, sale fiscal invoice, ingredient
#     HACCP) were never applied to Neon Postgres.
#   - DATABASE_URL on Render points at Neon; VPS uses SQLite at
#     /data/rms.sqlite. Migration paths don't match.
#
# Until those are resolved, Render is a non-functional legacy deploy.

services:
  - type: web
    name: sazon-rms
    runtime: docker
    plan: free  # or 'starter' ($7/mo) to avoid spin-down
    region: oregon  # closest to Paraguay latam
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        sync: false  # set in dashboard; from Neon
      - key: SESSION_SECRET
        generateValue: true
      - key: FERNET_KEY
        sync: false  # generated by app on first boot, then locked
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        value: sazon-rms-backups
      - key: R2_ENDPOINT
        value: https://<account>.r2.cloudflarestorage.com
      - key: BIND_HOST
        value: 0.0.0.0  # Render needs 0.0.0.0; we don't expose this port anyway
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AIW_RMS_LOG_DIR
        value: /tmp/sazon-logs

      # Supabase auth (NAV-A.1: prevents "credenciales inválidas" after
      # every fresh deploy — Render Blueprints re-set env vars when the
      # sync attribute is true, but secrets must be set once in the
      # Render dashboard and survive all deploys).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # NAV-02: Auditoría and Ops are internal-only and not mounted
      # unless this is set. Production does not set this; tests/dev do.
      - key: AIW_SASKIA_INTERNAL_ROUTES
        value: "0"

# Note: DATABASE_URL comes from a Neon project you create separately.
# Note: FERNET_KEY is auto-generated by the app on first run; back it up
#       in BWS immediately after first boot. Restoring the DB without
#       the matching key = lost backups.
# Note: For production, change plan: 'starter' ($7/mo) to avoid
#       free-tier spin-down. Use UptimeRobot to ping every 5min as
#       mitigation while on free tier.