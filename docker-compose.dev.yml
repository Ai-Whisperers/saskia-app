version: "3.9"

# Per docs/plans/2026-09-07-sazon-complete-epic-plan-v3.md E24.S4.
# Local development Postgres for contributors who want to test against
# real PG instead of SQLite. CI continues to use SQLite (faster, no
# container).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   export AIW_RMS_DB_URL=postgresql+psycopg2://sazon:sazon@localhost:5432/saskia
#   make migrate
#   make serve

services:
  postgres:
    image: postgres:16-alpine
    container_name: sazon-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sazon
      POSTGRES_PASSWORD: sazon
      POSTGRES_DB: sazon
    ports:
      - "5432:5432"
    volumes:
      - sazon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sazon"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sazon-postgres-data:
    driver: local
